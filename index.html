<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NARA by Ishita Ghosh | Somatic Performance Protocol</title>
    
    <meta property="og:title" content="NARA — Somatic Performance Protocol">
    <meta property="og:description" content="Built by Ishita Ghosh. Former World-Ranker in Karate and National Champion in Powerlifting. I beat a 5-year medical prognosis in 365 days.">
    <meta property="og:image" content="https://ishitaedu8.github.io/nara/assets/ishita.jpg">
    <meta name="description" content="NARA is a 90-day somatic nervous system protocol built by Ishita Ghosh — former World-Ranked Karate athlete and National Powerlifting Champion who recovered from a neuropsychiatric condition in 12 months against a 5-year prognosis.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --navy: #0A0E1F;
            --gold: #D4AF37;
            --gold-dark: #B8960C;
            --white: #F5F0E8;
        }

        body {
            background: var(--navy);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }

        .screen {
            position: absolute; inset: 0; display: none; flex-direction: column;
            opacity: 0; transition: opacity 0.4s ease; padding-bottom: 120px;
            overflow-y: auto;
        }
        .screen.active { display: flex; opacity: 1; z-index: 10; }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark)) !important;
            color: var(--navy) !important;
            font-weight: 700; padding: 18px 32px; border-radius: 50px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            width: 100%; text-transform: uppercase;
            cursor: pointer; border: none !important; margin-top: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px; backdrop-filter: blur(10px); padding: 24px;
        }

        input, select, textarea {
            background: #FFFFFF !important; color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
            padding: 16px !important; font-size: 16px !important;
            border: 2px solid var(--gold) !important; border-radius: 12px !important;
            width: 100%; margin-bottom: 16px; outline: none !important;
        }

        .voice-control-btn {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            background: rgba(18, 24, 51, 0.9); border: 1.5px solid var(--gold);
            color: var(--gold); padding: 8px 16px; border-radius: 30px; font-size: 11px;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(10, 14, 31, 0.98); border-top: 1px solid rgba(212, 175, 55, 0.2);
            display: none; justify-content: space-around; padding: 20px 0 40px; z-index: 100;
        }
        .bottom-nav.visible { display: flex; }

        .orb-inner {
            width: 120px; height: 120px; border-radius: 50%;
            background: var(--gold); display: flex; align-items: center; justify-content: center;
            font-weight: 900; color: var(--navy); transition: all 0.1s linear;
        }
    </style>
</head>
<body>

<button id="voice-guide-toggle" class="voice-control-btn" onclick="S.toggleVoice()">VOICE GUIDE: OFF</button>

<div id="opening" class="screen active">
    <div class="p-10 text-center">
        <img src="https://ishitaedu8.github.io/nara/assets/ishita.jpg" style="width:140px;height:140px;border-radius:50%;border:3px solid var(--gold);margin:0 auto 20px;object-fit:cover;">
        <h2 class="text-2xl">Ishita Ghosh</h2>
        <p class="text-gold text-sm mb-10">Solo Founder & Systems Architect</p>
        <button class="btn-gold" onclick="S.show('signup')">Begin Journey</button>
    </div>
</div>

<div id="signup" class="screen">
    <div class="p-8">
        <h2 class="text-gold text-2xl mb-8 text-center">Join the Council</h2>
        <div class="glass-card">
            <input type="text" id="u-name" placeholder="Full Name">
            <input type="number" id="u-phone" placeholder="WhatsApp Number">
            <input type="email" id="u-email" placeholder="Email Address">
            <select id="u-lang">
                <option value="en-US">English</option>
                <option value="hi-IN">Hinglish</option>
                <option value="bn-BD">Banglish</option>
            </select>
            <button class="btn-gold" onclick="S.claim()">Claim My Spot</button>
        </div>
    </div>
</div>

<div id="landing" class="screen">
    <div class="flex flex-col items-center justify-center min-h-full text-center p-10">
        <h1 class="text-6xl text-gold mb-10">NARA</h1>
        <button class="btn-gold" onclick="S.startQuiz()">Start Assessment</button>
    </div>
</div>

<div id="quiz" class="screen">
    <div class="p-8">
        <div id="q-box" class="glass-card min-h-[300px] text-center">
            <div id="q-num" class="text-gold text-xs mb-4">CARD 1 OF 10</div>
            <div id="q-text" class="text-xl font-bold mb-8"></div>
            <div id="q-opts" class="space-y-3"></div>
        </div>
    </div>
</div>

<div id="tracker" class="screen">
    <div class="p-10 text-center">
        <div class="text-8xl font-bold text-gold" id="score">1</div>
        <p class="text-gold uppercase font-bold mt-4">Degrees of Heat</p>
    </div>
</div>

<nav id="bnav" class="bottom-nav">
    <button onclick="S.nav('landing')">MISSION</button>
    <button onclick="S.nav('tracker')">TRACKER</button>
</nav>

<script>
const S = (() => {
    let state = { day: 1, step: 0, voice: false, lang: 'en-US' };
    const cards = [
        { q: "When criticized, you feel?", o: ["Numb", "Rage", "Shame", "Invisible"] },
        { q: "Morning body feel?", o: ["Heavy", "Wired", "Numb", "Grounded"] },
        { q: "During conflict, you?", o: ["Shut down", "Explode", "Dissociate", "Stay regulated"] }
    ];

    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function toggleVoice() {
        state.voice = !state.voice;
        document.getElementById('voice-guide-toggle').innerText = state.voice ? "VOICE GUIDE: ON" : "VOICE GUIDE: OFF";
        if(state.voice) { const u = new SpeechSynthesisUtterance("NARA Activated"); window.speechSynthesis.speak(u); }
    }

    function claim() {
        const n = document.getElementById('u-name').value;
        const p = document.getElementById('u-phone').value;
        const e = document.getElementById('u-email').value;
        if(!n || !p || !e) return alert("Enter Name, Phone and Email");
        show('landing');
    }

    function startQuiz() { render(0); show('quiz'); }
    function render(idx) {
        const c = cards[idx % cards.length];
        document.getElementById('q-text').innerText = c.q;
        const box = document.getElementById('q-opts');
        box.innerHTML = '';
        c.o.forEach(opt => {
            const b = document.createElement('button');
            b.className = 'btn-gold'; b.innerText = opt;
            b.onclick = () => { if(idx < 9) render(idx+1); else show('tracker'); };
            box.appendChild(b);
        });
    }

    function nav(id) { show(id); document.getElementById('bnav').classList.add('visible'); }

    return { show, claim, startQuiz, nav, toggleVoice };
})();
</script>
</body>
</html>
